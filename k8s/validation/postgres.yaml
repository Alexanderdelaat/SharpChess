apiVersion: v1
kind: Secret
metadata:
  name: sharpchess-postgres
  namespace: sharpchess-validation
type: Opaque
stringData:
  POSTGRES_DB: sharpchess
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: devpassword
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sharpchess-db
  namespace: sharpchess-validation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sharpchess-db
  template:
    metadata:
      labels:
        app: sharpchess-db
    spec:
      containers:
        - name: postgres
          image: postgres:17
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - secretRef:
                name: sharpchess-postgres
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "sharpchess"]
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "sharpchess"]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: sharpchess-db
  namespace: sharpchess-validation
spec:
  selector:
    app: sharpchess-db
  ports:
    - port: 5432
      targetPort: postgres
      protocol: TCP
