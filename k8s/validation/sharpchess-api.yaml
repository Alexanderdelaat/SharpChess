apiVersion: apps/v1
kind: Deployment
metadata:
  name: sharpchess-api
  namespace: sharpchess-validation
spec:
  replicas: 2
  minReadySeconds: 5
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: sharpchess-api
  template:
    metadata:
      labels:
        app: sharpchess-api
    spec:
      containers:
        - name: sharpchess-api
          image: sharpchess-api:validation-v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Development
            - name: Database__RunMigrationsOnStartup
              value: "false"
            - name: ConnectionStrings__DefaultConnection
              value: Host=sharpchess-db;Port=5432;Database=sharpchess;Username=postgres;Password=devpassword
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: sharpchess-api
  namespace: sharpchess-validation
spec:
  selector:
    app: sharpchess-api
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
  type: ClusterIP
