apiVersion: apps/v1
kind: Deployment
metadata:
  name: sharpchess-api
spec:
  replicas: 2
  minReadySeconds: 5
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: sharpchess-api
  template:
    metadata:
      labels:
        app: sharpchess-api
    spec:
      containers:
        - name: sharpchess-api
          image: ghcr.io/alexanderdelaat/sharpchess-api:sha-675e940
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Development
            - name: Database__RunMigrationsOnStartup
              value: "false"
            - name: ConnectionStrings__DefaultConnection
              value: Host=sharpchess-db;Port=5432;Database=sharpchess;Username=postgres;Password=devpassword
            - name: Jwt__Issuer
              value: SharpChess.Api
            - name: Jwt__Audience
              value: SharpChess.Frontend
            - name: Jwt__SigningKey
              value: ChangeThisDevelopmentSigningKey_AtLeast32Characters!
            - name: Jwt__AccessTokenMinutes
              value: "15"
            - name: Jwt__RefreshTokenDays
              value: "7"
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: sharpchess-api
spec:
  selector:
    app: sharpchess-api
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP
