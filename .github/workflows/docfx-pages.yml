name: Deploy DocFX to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DOTNET_VERSION: "10.0.x"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Install DocFX
        run: dotnet tool update -g docfx

      - name: Install ReportGenerator
        run: dotnet tool update -g dotnet-reportgenerator-globaltool

      - name: Add .NET tools to PATH
        run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Restore
        run: dotnet restore

      - name: Test with coverage
        run: dotnet test --configuration Release --collect:"XPlat Code Coverage"

      - name: Generate coverage report
        run: reportgenerator -reports:"**/coverage.cobertura.xml" -targetdir:"coverage-report" -reporttypes:"Html"

      - name: Configure K3s kubeconfig
        env:
          K3S_KUBECONFIG: ${{ secrets.K3S_KUBECONFIG }}
        run: |
          if [ -z "${K3S_KUBECONFIG}" ]; then
            exit 0
          fi

          mkdir -p "$RUNNER_TEMP/.kube"
          printf '%s' "${K3S_KUBECONFIG}" > "$RUNNER_TEMP/.kube/config"
          chmod 600 "$RUNNER_TEMP/.kube/config"
          echo "KUBECONFIG=$RUNNER_TEMP/.kube/config" >> "$GITHUB_ENV"

      - name: Generate K3s health snapshot
        env:
          K3S_NAMESPACE: ${{ vars.K3S_NAMESPACE }}
          K3S_LABEL_SELECTOR: ${{ vars.K3S_LABEL_SELECTOR }}
        run: bash scripts/generate-k3s-health.sh

      - name: Generate Notion Kanban Markdown
        env:
          NOTION_EMBED_URL: ${{ secrets.NOTION_EMBED_URL }}
          NOTION_PUBLIC_BOARD_URL: ${{ vars.NOTION_PUBLIC_BOARD_URL || secrets.NOTION_PUBLIC_BOARD_URL }}
        run: bash scripts/sync-notion-kanban.sh

      - name: Build DocFX site
        run: docfx docfx.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
