name: Deploy DocFX to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DOTNET_VERSION: "10.0.x"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install DocFX
        run: dotnet tool update -g docfx

      - name: Install ReportGenerator
        run: dotnet tool update -g dotnet-reportgenerator-globaltool

      - name: Add .NET tools to PATH
        run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Restore
        run: dotnet restore

      - name: Test with coverage
        run: dotnet test --configuration Release --collect:"XPlat Code Coverage"

      - name: Generate coverage report
        run: reportgenerator -reports:"**/coverage.cobertura.xml" -targetdir:"coverage-report" -reporttypes:"Html"

      - name: Upload Kubernetes pod health snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: kubernetes-pod-health
          path: docs/kubernetes-pod-health.md
          if-no-files-found: error

      - name: Generate Notion Kanban Markdown
        env:
          NOTION_EMBED_URL: ${{ secrets.NOTION_EMBED_URL }}
          NOTION_PUBLIC_BOARD_URL: ${{ vars.NOTION_PUBLIC_BOARD_URL || secrets.NOTION_PUBLIC_BOARD_URL }}
        run: bash scripts/sync-notion-kanban.sh

      - name: Generate SonarCloud metrics page
        env:
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY || secrets.SONAR_PROJECT_KEY }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_BRANCH: main
        run: python3 scripts/generate-sonarcloud-docs.py

      - name: Clean DocFX output
        run: rm -rf _site

      - name: Build DocFX site
        run: docfx docfx.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
