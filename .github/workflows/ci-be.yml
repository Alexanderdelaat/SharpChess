name: CI - Backend (.NET)
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
env:
  DOTNET_VERSION: "10.0.x"
  BACKEND_DIR: "."
jobs:
  build_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ env.DOTNET_VERSION }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ env.DOTNET_VERSION }}-
            nuget-${{ runner.os }}-
      - name: Restore
        working-directory: ${{ env.BACKEND_DIR }}
        run: dotnet restore
      - name: Format check
        working-directory: ${{ env.BACKEND_DIR }}
        run: dotnet format --verify-no-changes
      - name: Build
        working-directory: ${{ env.BACKEND_DIR }}
        run: dotnet build --no-restore -c Release
      - name: Test
        working-directory: ${{ env.BACKEND_DIR }}
        run: dotnet test --no-build -c Release --collect:"XPlat Code Coverage"
      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Generate coverage report
        run: reportgenerator -reports:"**/coverage.cobertura.xml" -targetdir:"coverage-report" -reporttypes:"Html;MarkdownSummary"

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-report
          path: coverage-report/
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: "**/coverage.cobertura.xml"

  k8s_validation:
    runs-on: ubuntu-latest
    needs: build_test
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1.12.0
        with:
          cluster_name: sharpchess-validation

      - name: Build validation images
        run: |
          docker build --build-arg APP_VERSION=validation-v1 -t sharpchess-api:validation-v1 .
          docker build --build-arg APP_VERSION=validation-v2 -t sharpchess-api:validation-v2 .

      - name: Pull support images
        run: |
          docker pull postgres:17
          docker pull busybox:1.36

      - name: Load images into kind
        run: |
          kind load docker-image sharpchess-api:validation-v1 --name sharpchess-validation
          kind load docker-image sharpchess-api:validation-v2 --name sharpchess-validation
          kind load docker-image postgres:17 --name sharpchess-validation
          kind load docker-image busybox:1.36 --name sharpchess-validation

      - name: Apply validation manifests
        run: |
          kubectl apply -f k8s/validation/namespace.yaml
          kubectl apply -f k8s/validation/postgres.yaml
          kubectl -n sharpchess-validation rollout status deployment/sharpchess-db --timeout=180s
          kubectl apply -f k8s/validation/sharpchess-migrator.yaml
          kubectl -n sharpchess-validation wait --for=condition=complete job/sharpchess-api-migrator --timeout=180s
          kubectl apply -f k8s/validation/sharpchess-api.yaml

      - name: Validate Kubernetes self-healing and rolling updates
        run: bash scripts/validate-k8s.sh

      - name: Collect Kubernetes diagnostics
        if: failure()
        run: |
          kubectl get all -A
          kubectl -n sharpchess-validation get events --sort-by=.lastTimestamp
          kubectl -n sharpchess-validation describe deployment sharpchess-api
          kubectl -n sharpchess-validation describe deployment sharpchess-db
          kubectl -n sharpchess-validation describe pods
          kubectl -n sharpchess-validation logs -l app=sharpchess-api --all-containers=true --tail=200
          kubectl -n sharpchess-validation logs -l app=sharpchess-db --all-containers=true --tail=200

  docker:
    runs-on: ubuntu-latest
    needs: [build_test, k8s_validation]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to the Container registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/sharpchess-api
            ghcr.io/alexanderdelaat/sharpchess-api
          tags: |
            type=sha

      - name: Build and push Docker images
        id: push
        uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671
        with:
          context: .
          build-args: |
            APP_VERSION=${{ github.sha }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
