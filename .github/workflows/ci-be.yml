name: CI - Backend (.NET)
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
env:
  DOTNET_VERSION: "10.0.x"
  BACKEND_DIR: "."
jobs:
  build_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ env.DOTNET_VERSION }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ env.DOTNET_VERSION }}-
            nuget-${{ runner.os }}-
      - name: Restore
        working-directory: ${{ env.BACKEND_DIR }}
        run: dotnet restore
      - name: Format check
        working-directory: ${{ env.BACKEND_DIR }}
        run: dotnet format --verify-no-changes
      - name: Build
        working-directory: ${{ env.BACKEND_DIR }}
        run: dotnet build --no-restore -c Release
      - name: Test
        working-directory: ${{ env.BACKEND_DIR }}
        run: dotnet test --no-build -c Release --collect:"XPlat Code Coverage"
      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Generate coverage report
        run: reportgenerator -reports:"**/coverage.cobertura.xml" -targetdir:"coverage-report" -reporttypes:"Html;MarkdownSummary"
        
      - name: Copy coverage summary to DocFX
        run: mkdir -p coverage
              cp coverage-report/summary.md coverage/index.md

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-report
          path: coverage-report/
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: "**/coverage.cobertura.xml"
          

  docker:
    runs-on: ubuntu-latest
    needs: build_test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to the Container registry
        uses: docker/login-action@d43e1c853e1fb3780e2a1187b33970c59f58c314
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/sharpchess-api
            ghcr.io/alexanderdelaat/sharpchess-api
          tags: |
            type:sha

      - name: Build and push Docker images
        id: push
        uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}