  summary: >-
    Tries to handle the specified exception asynchronously within the ASP.NET Core pipeline.

    Implementations of this method can provide custom exception-handling logic for different scenarios.
  example: []
  syntax:
    content: public ValueTask<bool> TryHandleAsync(HttpContext httpContext, Exception exception, CancellationToken cancellationToken)
    parameters:
    - id: httpContext
      type: Microsoft.AspNetCore.Http.HttpContext
      description: The <xref href="Microsoft.AspNetCore.Http.HttpContext" data-throw-if-not-resolved="false"></xref> for the request.
    - id: exception
      type: System.Exception
      description: The unhandled exception.
    - id: cancellationToken
      type: System.Threading.CancellationToken
      description: The cancellation token.
    return:
      type: System.Threading.Tasks.ValueTask{System.Boolean}
      description: >-
        A task that represents the asynchronous read operation. The value of its <xref href="System.Threading.Tasks.ValueTask%601.Result" data-throw-if-not-resolved="false"></xref>

        property contains the result of the handling operation.

        <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">true</a> if the exception was handled successfully; otherwise <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">false</a>.
